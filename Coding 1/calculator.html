<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #d63384;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #d6b533;
        }
        button {
            background-color: #99ff99;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff66ad;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #771ac9;
        }
    </style>
</head>
<body>

    <h1>Simple Calculator </h1>

    <input type="text" id="num1" placeholder="Enter First Number">
    <input type="text" id="num2" placeholder="Enter Second Number"><br>

    <button onclick="calculate('add')">Addition</button>
    <button onclick="calculate('subtract')">Subtraction</button>
    <button onclick="calculate('multiply')">Multiplication</button>
    <button onclick="calculate('divide')">Division</button>
    <button onclick="clearInputs()">Clear</button>

    <div class="result" id="result"></div>

    <script>
        function calculate(operation) {
            let a = document.getElementById('num1').value.trim();
            let b = document.getElementById('num2').value.trim();

            // Check if inputs are valid integers (allow negatives)
            if (a === '' || b === '') {
                document.getElementById('result').innerText = "Please enter both numbers!";
                return;
            }
            if (!/^[-]?\d+$/.test(a) || !/^[-]?\d+$/.test(b)) {
                document.getElementById('result').innerText = "Invalid input! Only integers allowed.";
                return;
            }

            a = parseInt(a);
            b = parseInt(b);

            let result;
            if (operation === 'add') {
                result = a + b;
                document.getElementById('result').innerText = `Addition is ${result}`;
            } else if (operation === 'subtract') {
                result = a - b;
                document.getElementById('result').innerText = `Subtraction is ${result}`;
            } else if (operation === 'multiply') {
                result = a * b;
                document.getElementById('result').innerText = `Multiplication is ${result}`;
            } else if (operation === 'divide') {
                if (b === 0) {
                    document.getElementById('result').innerText = "Cannot divide by zero!";
                    return;
                }
                result = a / b;
                document.getElementById('result').innerText = `Division is ${result}`;
            }
        }

        function clearInputs() {
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('result').innerText = '';
        }
    </script>

</body>
</html>
